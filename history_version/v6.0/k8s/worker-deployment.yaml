apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-worker
  namespace: arc-knowledge
  labels:
    app: arc-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arc-worker
  template:
    metadata:
      labels:
        app: arc-worker
    spec:
      containers:
        - name: arc-worker
          image: arc-knowledge-ai:latest
          command: ["python", "scripts/start_worker.py"]
          envFrom:
            - configMapRef:
                name: arc-knowledge-config
            - secretRef:
                name: arc-knowledge-secret
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
