# 模板文件：实际部署前替换 <base64-encoded-xxx> 为真实值
# 生成方式：echo -n "your-secret" | base64
#
# 生产环境建议使用 Sealed Secrets / Vault / AWS Secrets Manager 管理

apiVersion: v1
kind: Secret
metadata:
  name: arc-knowledge-secret
  namespace: arc-knowledge
type: Opaque
data:
  OPENAI_API_KEY: <base64-encoded-openai-api-key>
  JWT_SECRET: <base64-encoded-jwt-secret>
  MINIO_ACCESS_KEY: <base64-encoded-minio-access-key>
  MINIO_SECRET_KEY: <base64-encoded-minio-secret-key>
  POSTGRES_PASSWORD: <base64-encoded-postgres-password>
