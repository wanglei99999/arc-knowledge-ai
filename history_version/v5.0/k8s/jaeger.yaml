# Jaeger all-in-one（开发 / staging 环境）
# 生产环境建议使用 Jaeger Operator 或 Grafana Tempo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: arc-knowledge
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          ports:
            - containerPort: 4317   # OTLP gRPC
            - containerPort: 16686  # Jaeger UI
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-svc
  namespace: arc-knowledge
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: ui
      port: 16686
      targetPort: 16686
