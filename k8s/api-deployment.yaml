apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-api
  namespace: arc-knowledge
  labels:
    app: arc-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arc-api
  template:
    metadata:
      labels:
        app: arc-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: arc-api
          image: arc-knowledge-ai:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: arc-knowledge-config
            - secretRef:
                name: arc-knowledge-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: arc-api-svc
  namespace: arc-knowledge
spec:
  selector:
    app: arc-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
